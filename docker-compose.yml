services:
  playlistSync:
    image: ghcr.io/ronfburgundy/plex-playlist-sync:latest
    container_name: playlistSync
    restart: unless-stopped
    volumes:
      # Optional: only needed if WRITE_MISSING_AS_CSV=1
      - ./data:/data
    environment:
      # Plex Settings (Required)
      - PLEX_URL=http://localhost:32400
      - PLEX_TOKEN=your_plex_token_here
      - PLEX_VERIFY_SSL=1

      # Sync Behaviors
      - SECONDS_TO_WAIT=86400
      - RUN_ONCE=0
      - APPEND_INSTEAD_OF_SYNC=0
      - APPEND_SERVICE_SUFFIX=1
      - ADD_PLAYLIST_POSTER=1
      - ADD_PLAYLIST_DESCRIPTION=1
      - WRITE_MISSING_AS_CSV=0
      - SEARCH_SIMILARITY_THRESHOLD=0.9
      - LOG_LEVEL=INFO

      # Spotify Options (Option 1)
      - SPOTIFY_CLIENT_ID=
      - SPOTIFY_CLIENT_SECRET=
      - SPOTIFY_USER_ID=
      - SPOTIFY_PLAYLIST_ID=

      # Deezer Options (Option 2)
      - DEEZER_USER_ID=
      - DEEZER_PLAYLIST_ID=
