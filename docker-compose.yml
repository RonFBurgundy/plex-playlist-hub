services:
  playlistHub:
    image: ghcr.io/ronfburgundy/plex-playlist-hub:latest
    container_name: playlistHub
    restart: unless-stopped
    ports:
      - "5250:5250"
    volumes:
      - ./data:/data
    environment:
      # Port & Host
      - PORT=5250

      # Plex Settings (Required)
      - PLEX_URL=http://localhost:32400
      - PLEX_TOKEN=your_plex_token_here
      - PLEX_VERIFY_SSL=1

      # Sync Behaviors
      - SECONDS_TO_WAIT=86400
      - RUN_ONCE=0
      - APPEND_INSTEAD_OF_SYNC=0
      - APPEND_SERVICE_SUFFIX=1
      - ADD_PLAYLIST_POSTER=1
      - ADD_PLAYLIST_DESCRIPTION=1
      - WRITE_MISSING_AS_CSV=0
      - SEARCH_SIMILARITY_THRESHOLD=0.9
      - LOG_LEVEL=INFO

      # Spotify Options
      - SPOTIFY_CLIENT_ID=
      - SPOTIFY_CLIENT_SECRET=
      - SPOTIFY_USER_ID=
      - SPOTIFY_PLAYLIST_ID=

      # Deezer Options
      - DEEZER_USER_ID=
      - DEEZER_PLAYLIST_ID=
