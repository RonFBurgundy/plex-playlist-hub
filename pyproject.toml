[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-playlist-sync"
version = "1.0.0"
description = "Sync Spotify and Deezer playlists with your local Plex media server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Ron Burgundy", email = "ron@burgundy.local" },
    { name = "rnagabhyrava" }
]
keywords = ["plex", "spotify", "deezer", "playlist", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "spotipy>=2.25.0",
    "plexapi>=4.18.0",
    "deezer-python>=7.4.0",
    "requests>=2.32.0",
    "urllib3>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
plex-playlist-sync = "plex_playlist_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plex_playlist_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
